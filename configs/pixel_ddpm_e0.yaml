experiment: "E0"
description: "Pixel-space baseline DDPM on 64x64 OrganAMNIST"

model:
  type: "pixel_ddpm"
  in_channels: 1
  out_channels: 1
  base_channels: 64
  channel_mults: [1, 2, 4]
  num_res_blocks: 2

diffusion:
  timesteps: 1000
  beta_schedule: "linear"
  sampling_strategy: "uniform"

training:
  seed: 42
  batch_size: 64
  lr: 0.0001
  total_steps: 40000
  save_dir: "checkpoints/pixel_ddpm_e0"

