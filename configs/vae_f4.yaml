model:
  type: "vae"
  in_channels: 1
  latent_channels: 4
  down_channels: [32, 64, 128]
  latent_factor: 4 # 64x64 -> 16x16

data:
  dataset: "organamnist"
  size: 64
  batch_size: 64
  num_workers: 2

training:
  seed: 42
  lr: 0.0002
  kl_weight: 0.00001
  epochs: 50
  save_dir: "checkpoints/vae_f4"
